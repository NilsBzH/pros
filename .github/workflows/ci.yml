name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx @vscode/vsce package --out pros-macro-language.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: pros-macro-language-vsix
          path: pros-macro-language.vsix
